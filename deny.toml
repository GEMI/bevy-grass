[advisories]
version = 2
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is transitive through Bevy 0.20's winit; no safe upgrade is available" },
    { id = "RUSTSEC-2026-0344", reason = "ruzstd 0.8 is pinned by Bevy 0.20; the fix is only in 0.9.1" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
