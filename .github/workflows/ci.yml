name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Every preset rendered headless by a software rasterizer, which draws the
  # same on every machine, and compared with tests/golden/<renderer>/. The
  # first run on a new renderer has no goldens: bless them locally with the
  # same renderer (see examples/golden.rs) or take them from the artifact.
  golden:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend: dx12
          - os: ubuntu-latest
            backend: vulkan
    runs-on: ${{ matrix.os }}
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      WGPU_FORCE_FALLBACK_ADAPTER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries and lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers
      - run: cargo run --example golden
      - name: Keep the mismatching images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: target/golden/
