name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bless_goldens:
        description: "Bless the Linux software-renderer goldens and upload them"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev
      - run: cargo fmt --check
      # Clippy, warnings as errors, per feature set: see tools/lint.py.
      - run: python tools/lint.py
      - run: cargo test
      - run: cargo test --features rapier
      - run: cargo test --features avian
      # The bench's budget/percentile tests live in the example, which the
      # plain `cargo test` does not run.
      - run: cargo test --example bench
      - run: python -m py_compile tools/bench_240.py
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,typos
      - run: cargo machete
      - run: typos
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The library, the examples and the web demo build for the browser
  # (WebGPU). This checks that they compile; whether the browser accepts the
  # pipelines is checked by hand with tools/web_demo.py smoke, since hosted
  # runners have no WebGPU.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown --lib --examples
      # The demo's calls from the page exist only on wasm.
      - run: cargo clippy -p bevy_grass_web --target wasm32-unknown-unknown -- -D warnings
      - run: python -m py_compile tools/web_example.py tools/web_demo.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev
      - run: cargo +1.97.1 check --all-targets --all-features

  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: origin/${{ github.base_ref }}

  # Every preset rendered headless by a software rasterizer, which draws the
  # same on every machine, and compared with tests/golden/<renderer>/. The
  # first run on a new renderer has no goldens: take the captures from the
  # artifact into tests/golden/<renderer>/, or run the golden-bless job below.
  # The Linux folder includes the Mesa and LLVM versions (examples/golden.rs),
  # so a compiler update asks for new goldens instead of comparing across
  # compilers.
  golden:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend: dx12
          - os: ubuntu-24.04
            backend: vulkan
    runs-on: ${{ matrix.os }}
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      WGPU_FORCE_FALLBACK_ADAPTER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries and lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers
      - run: cargo run --example golden
      - name: Keep the mismatching images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: target/golden/

  # Re-bless the Linux goldens on the same pinned runner and driver as the
  # check. Run this from the Actions tab (Run workflow, tick bless_goldens),
  # download the artifact, and commit the llvmpipe-... folder it contains.
  golden-bless:
    if: github.event_name == 'workflow_dispatch' && inputs.bless_goldens
    runs-on: ubuntu-24.04
    env:
      WGPU_BACKEND: vulkan
      WGPU_FORCE_FALLBACK_ADAPTER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers
      - run: cargo run --example golden -- --bless
      - uses: actions/upload-artifact@v4
        with:
          name: golden-bless-llvmpipe
          path: tests/golden/llvmpipe-*/
